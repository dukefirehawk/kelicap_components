targets:
  $default:
    builders:
      kelicap_components|scss_builder:
        enabled: True
      kelicap|kelicap:
        generate_for:
          exclude: ["lib/**"]

builders:
  kelicap_gallery:
    target: ":kelicap_gallery"
    import: "package:kelicap_gallery/builders.dart"
    builder_factories: [
      galleryAppBuilder,
      galleryLibBuilder,
      syntaxHighlightBuilder,
    ]
    # Every output of the three builders: the app builder (home.dart, and
    # index.html, main.dart and style.scss), the lib builder (lib/gallery/*)
    # and the syntax highlight builder (syntax_highlight.scss).
    build_extensions: {
      "^lib/gallery/home.html": ["lib/gallery/home.dart"],
      "$web$": ["index.html", "main.dart", "style.scss", "syntax_highlight.scss"],
      "$lib$": [
        "gallery/gallery.dart",
        "gallery/gallery.html",
        "gallery/gallery.scss",
        "gallery/gallery_route_library.dart"]}
    auto_apply: dependents
    runs_before: ["kelicap|kelicap", "kelicap_components|scss_builder"]
